<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Royal Velvet Maroon Background Gradient -->
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#991B24"/>
      <stop offset="55%" stop-color="#6B1118"/>
      <stop offset="100%" stop-color="#340509"/>
    </radialGradient>

    <!-- Shimmering Liquid Gold Gradients for the 'A' -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="22%" stop-color="#FDE047"/>
      <stop offset="55%" stop-color="#EAB308"/>
      <stop offset="85%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <!-- Natural Spice Green Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="55%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>

    <!-- Warm Aromatic Saffron Leaf Gradient -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <filter id="aShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#180204" flood-opacity="0.8"/>
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Royal Squircle Badge -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3.5"/>

  <!-- Inset Delicate Golden Dotted Border -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="27" fill="none" stroke="#FDE047" stroke-width="0.85" stroke-opacity="0.4" stroke-dasharray="3.5 2"/>

  <!-- Royal Sparkle Star perched atop the 'A' -->
  <path d="M 64,15 L 66.8,21.5 L 73,23 L 68,27 L 69.5,33.5 L 64,30 L 58.5,33.5 L 60,27 L 55,23 L 61.2,21.5 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.8" filter="url(#starGlow)"/>
  <circle cx="64" cy="24" r="1.5" fill="#FFFFFF"/>

  <!-- The Majestic Serif Letter 'A' -->
  <text
    x="64"
    y="96"
    font-family="Georgia, 'Times New Roman', Cambria, serif"
    font-size="88"
    font-weight="bold"
    text-anchor="middle"
    fill="url(#goldGrad)"
    filter="url(#aShadow)"
  >A</text>

  <!-- Botanical Spice Leaf Flourish across the 'A' crossbar -->
  <!-- Main Fresh Emerald Spice Leaf -->
  <path
    d="M 45,77 C 55,70 71,67 89,64 C 82,75 67,78 45,77 Z"
    fill="url(#leafGrad)"
    stroke="#FEF08A"
    stroke-width="0.9"
  />
  <!-- Golden Leaf Center Vein -->
  <path d="M 46,77 Q 66,72 87,65" stroke="#FEF08A" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Saffron Spice Aroma Sprout Fluttering Upward -->
  <path
    d="M 72,68 C 80,60 88,57 93,52 C 89,62 82,67 72,68 Z"
    fill="url(#saffronGrad)"
    stroke="#FEF08A"
    stroke-width="0.8"
  />
  <path d="M 73,67 Q 83,61 92,53" stroke="#FFFBEB" stroke-width="0.8" fill="none" stroke-linecap="round"/>
</svg>
